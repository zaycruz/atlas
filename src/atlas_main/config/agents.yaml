agents:
  echo-coder:
    description: Local echo-based coding agent for vertical slice demo
    type: process
    command:
      - "{python}"
      - -m
      - atlas_main.agents.examples.echo_agent
    timeout: 60
  codex:
    description: GitHub Codex CLI adapter (requires authenticated codex CLI)
    type: codex
    binary: codex
    timeout: 900
    args:
      - --full-auto
  claude-code:
    description: Claude Code CLI adapter (requires Claude CLI setup)
    type: claude
    binary: claude
    timeout: 900
    permission_mode: acceptEdits
  droid:
    description: Factory Droid CLI adapter (requires FACTORY_API_KEY)
    type: droid
    binary: droid
    timeout: 900
    auto_level: medium
  planner-deepseek:
    description: DeepSeek-R1 reasoning planner via Ollama
    type: reasoning
    provider: ollama
    model: deepseek-r1:latest
    timeout: 300
    max_tokens: 8000
  planner-sonnet:
    description: Claude Sonnet 4.5 planner with tools
    type: reasoning
    provider: anthropic
    model: claude-sonnet-4.5-20250514
    timeout: 300
    max_tokens: 8000
  planner-gpt5:
    description: OpenAI GPT-5 planner
    type: reasoning
    provider: openai
    model: gpt-5-turbo
    timeout: 300
    max_tokens: 8000
